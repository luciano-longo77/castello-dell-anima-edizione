name: Validate MC

# Validazione dell'edizione: per ogni micro-commit valida il modulo <text>
# (che include il teiHeader via XInclude) contro lo schema ODD del progetto.
on:
  push:
    branches: [main]
    paths:
      - "Micro-commits/**/data/**"
      - "Micro-commits/**/tests/**"
      - "tei-model/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "Micro-commits/**/data/**"
      - "Micro-commits/**/tests/**"
      - "tei-model/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Installa lxml
        run: pip install lxml
      - name: Installa xmllint e jing
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils jing
      - name: Valida ogni micro-commit
        run: |
          set -e
          shopt -s nullglob
          found=0
          for TEXT in Micro-commits/*/data/castello-anima-text.xml; do
            found=1
            DIR=$(dirname "$TEXT")
            RNG="$DIR/castello-anima-odd.rng"
            echo "::group::$TEXT"
            test -s "$RNG" || { echo "::error::$RNG mancante o vuoto"; exit 1; }
            # 1) NFC
            python3 .github/workflows/guardia_nfc.py "$DIR"
            # 2) ben formato + risoluzione XInclude (il <text> include il teiHeader)
            xmllint --noout --xinclude "$TEXT"
            # 3) RelaxNG (jing) sul documento risolto
            xmllint --nofixup-base-uris --xinclude "$TEXT" > /tmp/resolved.xml
            jing "$RNG" /tmp/resolved.xml
            # 4) guardia puntatori (integrità referenziale + term/@ref + change/@ana)
            python3 .github/workflows/guardia_puntatori.py "$TEXT"
            # 5) guardia apparato (retrace @hand/@resp, @varSeq, corr@resp, cartulazione)
            python3 .github/workflows/guardia_apparato.py "$TEXT"
            echo "::endgroup::"
          done
          test "$found" = 1 || { echo "::error::nessun Micro-commits/*/data/castello-anima-text.xml trovato"; exit 1; }
          echo "Validazione completata."
      - name: Regressione (gli input errati devono essere respinti)
        run: |
          set -e
          shopt -s nullglob
          for T in Micro-commits/*/tests/run_regression.py; do
            echo "::group::regressione $T"
            python3 "$T"
            echo "::endgroup::"
          done
      - name: Verifica i modelli generici (tei-model, sola forma)
        run: |
          set -e
          # I modelli generici NON sono validati contro l'ODD di progetto (contengono
          # scheletri/placeholder): se ne verifica solo forma NFC e buona formazione XML.
          # NFC con lo STESSO guardia_nfc.py usato per i dati (niente logica NFC duplicata).
          for d in $(find tei-model -name '*.xml' -exec dirname {} \; | sort -u); do
            python3 .github/workflows/guardia_nfc.py "$d"
          done
          # buona formazione per ogni modello
          n=0
          while IFS= read -r XML; do
            n=$((n+1))
            echo "::group::$XML"
            xmllint --noout "$XML"
            echo "::endgroup::"
          done < <(find tei-model -name '*.xml')
          echo "Modelli tei-model verificati ($n file): NFC (guardia_nfc.py) + ben formato."
      - name: Report ambiente + artifact di validazione
        if: always()
        run: |
          mkdir -p _validation
          {
            python3 --version
            python3 -c "import lxml.etree as e; print('lxml', e.__version__, '| libxml2', '.'.join(map(str,e.LIBXML_VERSION)), '| libxslt', '.'.join(map(str,e.LIBXSLT_VERSION)))"
            xmllint --version 2>&1 | head -1
          } > _validation/versions.txt || true
          cp -f /tmp/resolved.xml _validation/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: _validation/
          if-no-files-found: ignore
